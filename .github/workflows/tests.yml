name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      STARPLOT_DATA_PATH: ${{ github.workspace }}/.starplot-data
    steps:
      - uses: actions/checkout@v4

      # CairoSVG (used by starplot to write PNGs) needs the Cairo library
      - name: Install Cairo (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2
      - name: Install Cairo (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cairo
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Install Cairo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm mingw-w64-ucrt-x86_64-cairo
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}

      # Catalogs and ephemerides (~120 MB) downloaded on first use
      - uses: actions/cache@v4
        with:
          path: .starplot-data
          key: starplot-data-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - run: uv sync --locked
      - run: uv run pytest -q

      - name: Build and smoke-test the wheel
        shell: bash
        run: |
          uv build
          uv venv --python ${{ matrix.python }} smoke
          uv pip install --python smoke dist/*.whl
          cd "$RUNNER_TEMP"
          uv run --no-project --python "$GITHUB_WORKSPACE/smoke" horizonchart --version
          uv run --no-project --python "$GITHUB_WORKSPACE/smoke" horizonchart target Saturn -l "35.78N 78.64W" -t "2026-10-02 22:00" -o out
          ls out
